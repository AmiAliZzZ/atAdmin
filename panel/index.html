(function(){var shown={},ctx;

function show(a,sound){var d=document.createElement('div');d.style.cssText='background:linear-gradient(135deg,#2e1065,#4c1d95);color:#fff;border:1px solid #c084fc;border-radius:14px;padding:14px 16px;box-shadow:0 0 22px rgba(168,85,247,.8),0 0 50px rgba(220,38,38,.35);animation:atPop .4s ease';
